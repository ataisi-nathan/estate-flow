version: '3.8'

services:
  db:
    image: postgres:15
    container_name: realestate-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: estateFlow2025
      POSTGRES_DB: estate-flow
    ports:
      - '5433:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: realestate-redis
    restart: always
    ports:
      - '6379:6379'

volumes:
  db_data:
